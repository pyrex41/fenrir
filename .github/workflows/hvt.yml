# Builds the flake's pinned Solo5 and runs Fenrir guests under the hvt tender (KVM),
# comparing them with the Shen model and, frame for frame, with the spt tender.
# Development evidence only; no qualification verdict.
name: hvt

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hvt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Build pinned Solo5
        run: nix build .#solo5 --print-out-paths -L
      # Not hvt: the remote-perform system (Erlang/OTP supervisor and two guests) runs on
      # the spt tender. Its transport is plain files, so it needs no privileges and no KVM.
      - name: Remote perform on spt against the Shen model
        run: |
          export FENRIR_SOLO5=$(nix build .#solo5 --no-link --print-out-paths)
          nix shell --inputs-from . nixpkgs#nodejs_22 -c sh harness/run-tc1-remote-run.sh
      # hvt directly on the runner: one level of nesting.
      - name: hvt against the Shen model and spt, on the runner
        run: nix run .#hvt-compare
      # The same comparison inside a NixOS VM: the hvt guest is then nested one level
      # deeper, which depends on the runner exposing virtualisation to its guests.
      - name: hvt against the Shen model and spt, in a NixOS VM
        run: nix build .#checks.x86_64-linux.hvt -L

  # Separate from the Solo5 job. The regressions use a stub peer (see the script
  # header): killing the Erlang VM cannot be done with a guest the VM owns, and
  # these checks do not need a Solo5 image. They assert the contract and fail
  # on master until the journal is durable and the digest covers the function.
  # There is no xfail convention here, so this job is red on purpose.
  remote-effect-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Erlang/OTP
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y erlang-nox erlang-dev
      - name: Remote-effect regressions (expected red)
        run: sh harness/run-remote-effect-regress.sh
