\* Peer version advances. The signature digest does not. F changes.
\* Expected: VersionSafe is violated.
\* Trace: Issue at version 1, Deliver, Upgrade, Act, Deliver the reply.
\* The reply is F(2, arg), not F(1, arg).
CONSTANTS
  MaxCrash = 1
  MaxDup = 1
  MaxIntent = 1
  MaxAttempt = 2
  MaxVer = 2
  VMLoss = FALSE
  UpgradeOn = TRUE
  SupRestartOn = TRUE

INIT Init
NEXT Next
INVARIANT TypeOK
INVARIANT VersionSafe
CHECK_DEADLOCK FALSE
