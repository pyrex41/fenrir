\* Weak fairness of Issue, Deliver, Act, PeerRestart, NotDelivered.
\* timed_out does not count as settling the intent.
\* Expected: EventuallySettled is violated. One fair behavior is two timeouts
\* and then the request applied only after the caller has stopped. TLC may
\* print another fair violating behavior; the property is false either way.
CONSTANTS
  MaxCrash = 1
  MaxDup = 0
  MaxIntent = 1
  MaxAttempt = 2
  MaxVer = 1
  VMLoss = FALSE
  UpgradeOn = FALSE
  SupRestartOn = TRUE

SPECIFICATION FairSpec
PROPERTY EventuallySettled
INVARIANT TypeOK
CHECK_DEADLOCK FALSE
