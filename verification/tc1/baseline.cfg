  MaxCrash = 2
  MaxDup = 1
  MaxIntent = 2
  MaxAttempt = 2
  MaxVer = 1
  VMLoss = FALSE
  UpgradeOn = FALSE
  SupRestartOn = TRUE

INIT Init
NEXT Next
INVARIANT TypeOK
INVARIANT PerKey
INVARIANT NoDoubleApply
INVARIANT NDSound
INVARIANT SingleOutcome
INVARIANT VersionSafe
